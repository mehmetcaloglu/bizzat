services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: bizzat
      POSTGRES_PASSWORD: bizzat_dev
      POSTGRES_DB: bizzat
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - bizzat_postgres_data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bizzat -d bizzat"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  bizzat_postgres_data:
