name: Vehicle Batch2 Repro Once

on:
  push:
    branches:
      - feat/vehicle-curation-policy-batch-2

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Acquire August 2026 TSB snapshot
        run: |
          python -m pip install --disable-pip-version-check requests openpyxl
          curl -fsSL \
            https://raw.githubusercontent.com/mehmetcaloglu/bizzat/b9ae77a6afa57dd3c64b36de6324af13561d7df5/scripts/maintenance/acquire-tsb-source.py \
            -o /tmp/acquire-tsb-source.py
          for attempt in 1 2 3 4; do
            if python /tmp/acquire-tsb-source.py --year 2026 --month 8 --output /tmp/tsb.normalized.json; then
              break
            fi
            if [ "$attempt" = 4 ]; then exit 1; fi
            sleep $((attempt * 5))
          done
          python - <<'PY'
          import hashlib, json
          p='/tmp/tsb.normalized.json'
          raw=open(p,'rb').read()
          data=json.loads(raw)
          assert data['provider']['version']=='2026-08'
          assert len(data['records'])==27906
          print(json.dumps({'rows':len(data['records']),'sha256':hashlib.sha256(raw).hexdigest()}))
          PY
      - name: Build baseline bootstrap
        run: |
          python - <<'PY'
          import json
          cat=json.load(open('data/reference/vehicles/catalog.json'))
          brands={b['key']:b['name'] for b in cat['brands']}
          out={}
          for s in cat['series']:
            out.setdefault(brands[s['brandKey']],[]).append(s['name'])
          for values in out.values(): values.sort()
          json.dump(out,open('/tmp/bootstrap.json','w'),ensure_ascii=False,indent=2)
          PY
      - name: Regenerate against reviewed baseline
        run: |
          pnpm reference:generate:vehicle-catalog -- \
            /tmp/tsb.normalized.json \
            data/reference/vehicles/brand-aliases.json \
            data/reference/vehicles/series-aliases.json \
            /tmp/bootstrap.json \
            /tmp/batch2-generated \
            2026-09-13.2 \
            data/reference/vehicles
      - name: Audit delta
        run: |
          python - <<'PY'
          import json
          base_cat=json.load(open('data/reference/vehicles/catalog.json'))
          base_map=json.load(open('data/reference/vehicles/tsb-mappings.json'))
          new_cat=json.load(open('/tmp/batch2-generated/catalog.generated.json'))
          new_map=json.load(open('/tmp/batch2-generated/tsb-mappings.generated.json'))
          candidates=json.load(open('/tmp/batch2-generated/candidates.json'))
          summary=json.load(open('/tmp/batch2-generated/summary.json'))

          old_maps={m['sourceKey']:m['vehicleModelKey'] for m in base_map['mappings']}
          new_maps={m['sourceKey']:m['vehicleModelKey'] for m in new_map['mappings']}
          changed={k:(v,new_maps.get(k)) for k,v in old_maps.items() if new_maps.get(k)!=v}
          assert not changed, changed
          old_models={m['key']:m for m in base_cat['models']}
          new_models={m['key']:m for m in new_cat['models']}
          changed_models={k:(v,new_models.get(k)) for k,v in old_models.items() if new_models.get(k)!=v}
          assert not changed_models, list(changed_models)[:10]

          added_keys=sorted(set(new_maps)-set(old_maps))
          added=[{'sourceKey':k,'vehicleModelKey':new_maps[k]} for k in added_keys]
          allowed_prefixes=('opel:corsa:','volkswagen:passat:')
          assert all(x['vehicleModelKey'].startswith(allowed_prefixes) for x in added), added

          by_series={'opel:corsa':[],'volkswagen:passat':[]}
          for x in added:
            by_series['opel:corsa' if x['vehicleModelKey'].startswith('opel:corsa:') else 'volkswagen:passat'].append(x)

          added_models=sorted(set(new_models)-set(old_models))
          model_rows=[new_models[k] for k in added_models]
          assert all(m['seriesKey'] in by_series for m in model_rows), model_rows

          forbidden=[]
          for c in candidates:
            if c.get('modelStatus')!='mapped' or c.get('sourceKey') not in added_keys: continue
            raw=(c.get('typeRaw') or '').upper()
            if any(t in raw for t in ['CORSA-E',' CORSA E ',' VAN ','PASSAT VARIANT','ALLTRACK',' GTE ',' PASSAT CC ','1.5 ETSI','1.5 E-TSI']):
              forbidden.append(c)
          assert not forbidden, forbidden

          report={
            'summary':summary,
            'baselineMappings':len(old_maps),
            'newMappings':len(new_maps),
            'addedMappings':len(added),
            'baselineModels':len(old_models),
            'newModels':len(new_models),
            'addedModels':len(added_models),
            'bySeries':{k:{'mappings':len(v),'sourceKeys':[x['sourceKey'] for x in v]} for k,v in by_series.items()},
            'added':added,
            'addedModelRows':model_rows,
          }
          json.dump(report,open('/tmp/batch2-delta.json','w'),ensure_ascii=False,indent=2)
          print(json.dumps(report,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vehicle-batch2-repro
          path: |
            /tmp/batch2-generated/catalog.generated.json
            /tmp/batch2-generated/tsb-mappings.generated.json
            /tmp/batch2-generated/candidates.json
            /tmp/batch2-generated/summary.json
            /tmp/batch2-delta.json
          retention-days: 1
