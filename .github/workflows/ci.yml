name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: bizzat
          POSTGRES_PASSWORD: bizzat_ci
          POSTGRES_DB: bizzat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bizzat -d bizzat_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      TEST_DATABASE_URL: postgresql://bizzat:bizzat_ci@127.0.0.1:5432/bizzat_test
      DATABASE_URL: postgresql://bizzat:bizzat_ci@127.0.0.1:5432/bizzat_test
      NODE_ENV: test
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: bizzat-ci-auth-secret-00000000000001

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Explicit migration command
        run: pnpm --filter @bizzat/api db:migrate:raw

      - name: Import deterministic location fixture
        run: pnpm reference:import:locations -- data/reference/locations/fixture.locations.json

      - name: Generate deterministic vehicle curation fixture
        run: >-
          pnpm reference:generate:vehicle-catalog --
          data/reference/vehicles/fixture.tsb-source.json
          data/reference/vehicles/brand-aliases.json
          data/reference/vehicles/series-aliases.json
          data/reference/vehicles/fixture.bootstrap-models.json
          /tmp/bizzat-vehicle-curation-ci
          ci-fixture

      - name: Import curated Turkish vehicle catalog
        run: pnpm reference:import:vehicle-catalog -- data/reference/vehicles/catalog.json

      - name: Import deterministic TSB source fixture
        run: pnpm reference:import:vehicle-source -- tsb data/reference/vehicles/fixture.tsb-source.json

      - name: Apply deterministic TSB mapping fixture
        run: pnpm reference:apply:vehicle-mappings -- tsb data/reference/vehicles/fixture.tsb-mappings.json

      - name: Report deterministic TSB source coverage
        run: pnpm reference:report:vehicle-source -- tsb

      - name: Export vehicle curation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vehicle-curation-artifacts
          retention-days: 1
          path: |
            data/reference/vehicles/catalog.json
            data/reference/vehicles/tsb-mappings.json
            data/reference/vehicles/source-manifest.json
            data/reference/vehicles/curation-backlog.json

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify Next standalone output
        run: test -f apps/web/.next/standalone/apps/web/server.js
