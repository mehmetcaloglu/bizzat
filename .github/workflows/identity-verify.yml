name: Identity branch verify

on:
  push:
    branches: [feat/identity]

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: bizzat
          POSTGRES_PASSWORD: bizzat_ci
          POSTGRES_DB: bizzat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bizzat -d bizzat_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://bizzat:bizzat_ci@127.0.0.1:5432/bizzat_test
      DATABASE_URL: postgresql://bizzat:bizzat_ci@127.0.0.1:5432/bizzat_test
      NODE_ENV: test
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: bizzat-ci-auth-secret-00000000000001
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm contracts:build
      - run: pnpm --filter @bizzat/api db:migrate:raw
      - run: pnpm --filter @bizzat/api test:integration
      - run: pnpm --filter @bizzat/api typecheck
      - run: pnpm --filter @bizzat/api lint
      - run: pnpm --filter @bizzat/api build
      - name: Persist lockfile if changed
        run: |
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore: update pnpm lockfile"
            git push
          fi
