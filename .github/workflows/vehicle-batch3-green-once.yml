name: Vehicle Batch3 Green Once

on:
  push:
    branches:
      - feat/vehicle-curation-policy-batch-3

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vehicle-curation-policy-batch-3
          fetch-depth: 0
      - name: Apply reviewed production changes
        run: python scripts/tmp-batch3-green.py
      - name: Commit implementation and remove helper
        run: |
          rm scripts/tmp-batch3-green.py
          rm .github/workflows/vehicle-batch3-green-once.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/reference/vehicle/curation/model-label.ts \
                  apps/api/src/reference/vehicle/curation/review-diagnostics.ts \
                  apps/api/src/reference/vehicle/curation/reviewed-source-scope.ts \
                  scripts/tmp-batch3-green.py \
                  .github/workflows/vehicle-batch3-green-once.yml
          git commit -m 'feat: add reviewed Jetta and Linea normalization policies'
          git push origin HEAD:feat/vehicle-curation-policy-batch-3
