name: Vehicle Policy Batch Analysis

on:
  push:
    branches:
      - feat/vehicle-curation-policy-batch-1

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Acquire current August source
        run: |
          python -m pip install --disable-pip-version-check requests openpyxl
          curl -fsSL \
            https://raw.githubusercontent.com/mehmetcaloglu/bizzat/b9ae77a6afa57dd3c64b36de6324af13561d7df5/scripts/maintenance/acquire-tsb-source.py \
            -o /tmp/acquire-tsb-source.py
          python /tmp/acquire-tsb-source.py --year 2026 --month 8 --output /tmp/tsb.normalized.json

      - name: Fetch pinned bootstrap
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/serhatkildaci/global-car-models/44da5c9e5e0f3162d65579033f7a641473308b11/data/models.json \
            -o /tmp/bootstrap-models.json

      - name: Generate current diagnostics
        run: |
          pnpm reference:generate:vehicle-catalog -- \
            /tmp/tsb.normalized.json \
            data/reference/vehicles/brand-aliases.json \
            data/reference/vehicles/series-aliases.json \
            /tmp/bootstrap-models.json \
            /tmp/policy-batch-analysis \
            analysis \
            data/reference/vehicles

      - name: Summarize target series raw labels
        run: |
          python - <<'PY'
          import json, re
          from collections import Counter

          targets = [
            'opel:corsa', 'opel:insignia', 'volkswagen:passat',
            'skoda:octavia', 'skoda:superb', 'skoda:fabia', 'skoda:rapid',
          ]
          candidates = json.load(open('/tmp/policy-batch-analysis/candidates.json', encoding='utf-8'))
          body_tokens = [
            'SEDAN','HB','HATCHBACK','SW','STW','STATION','WAGON','COMBI','KOMBI',
            'LIFTBACK','SPORTBACK','COUPE','CABRIO','CABRIOLET','TOURER','5 KAPI','4 KAPI',
          ]
          technical_tokens = [
            'DSG','EDC','DCT','CVT','EAT6','EAT8','AT','MT','OTOMATIK','MANUEL',
            'S&S','S TRONIC','TIPTRONIC','MULTITRONIC','E5','E6','EURO 5','EURO 6','FL','PI',
          ]
          for series in targets:
            rows = [c for c in candidates if c.get('seriesKeyCandidate') == series and c.get('modelStatus') == 'model-review']
            print(f'=== {series} rows={len(rows)} ===')
            print('reasons', dict(Counter(c.get('reviewReason') for c in rows)))
            body = Counter()
            tech = Counter()
            for c in rows:
              text = c['typeRaw'].upper()
              for token in body_tokens:
                if token in text: body[token] += 1
              for token in technical_tokens:
                if token in text: tech[token] += 1
            print('bodyTokens', body.most_common())
            print('technicalTokens', tech.most_common(20))
            for c in rows:
              print(json.dumps({
                'sourceKey': c['sourceKey'],
                'reason': c.get('reviewReason'),
                'typeRaw': c['typeRaw'],
                'proposed': c.get('proposedModelLabel'),
              }, ensure_ascii=False))
          PY
