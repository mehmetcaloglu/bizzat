name: Vehicle Batch2 Materialize Once

on:
  push:
    branches:
      - feat/vehicle-curation-policy-batch-2-materialize-safety

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vehicle-curation-policy-batch-2-materialize-safety
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Acquire pinned August 2026 TSB snapshot
        run: |
          python -m pip install --disable-pip-version-check requests openpyxl
          curl -fsSL \
            https://raw.githubusercontent.com/mehmetcaloglu/bizzat/b9ae77a6afa57dd3c64b36de6324af13561d7df5/scripts/maintenance/acquire-tsb-source.py \
            -o /tmp/acquire-tsb-source.py
          for attempt in 1 2 3 4; do
            if python /tmp/acquire-tsb-source.py --year 2026 --month 8 --output /tmp/tsb.normalized.json; then
              break
            fi
            if [ "$attempt" = 4 ]; then exit 1; fi
            sleep $((attempt * 5))
          done
          python - <<'PY'
          import hashlib, json
          p='/tmp/tsb.normalized.json'
          raw=open(p,'rb').read()
          data=json.loads(raw)
          assert data['provider']['version']=='2026-08'
          assert len(data['records'])==27906
          sha=hashlib.sha256(raw).hexdigest()
          assert sha=='d810927023cc1fe50b457c83dec3b3dd485cee0f110f2a6b6d476c25d33c2b11', sha
          print(json.dumps({'rows':len(data['records']),'sha256':sha}))
          PY
      - name: Build reviewed baseline bootstrap
        run: |
          python - <<'PY'
          import json
          cat=json.load(open('data/reference/vehicles/catalog.json'))
          brands={b['key']:b['name'] for b in cat['brands']}
          out={}
          for s in cat['series']:
            out.setdefault(brands[s['brandKey']],[]).append(s['name'])
          for values in out.values(): values.sort()
          json.dump(out,open('/tmp/bootstrap.json','w'),ensure_ascii=False,indent=2)
          PY
      - name: Regenerate reviewed catalog
        run: |
          pnpm reference:generate:vehicle-catalog -- \
            /tmp/tsb.normalized.json \
            data/reference/vehicles/brand-aliases.json \
            data/reference/vehicles/series-aliases.json \
            /tmp/bootstrap.json \
            /tmp/batch2-generated \
            2026-09-13.2 \
            data/reference/vehicles
      - name: Audit and materialize verified delta
        run: |
          python - <<'PY'
          import json, shutil
          from collections import Counter, defaultdict

          base_cat=json.load(open('data/reference/vehicles/catalog.json'))
          base_map=json.load(open('data/reference/vehicles/tsb-mappings.json'))
          new_cat=json.load(open('/tmp/batch2-generated/catalog.generated.json'))
          new_map=json.load(open('/tmp/batch2-generated/tsb-mappings.generated.json'))
          candidates=json.load(open('/tmp/batch2-generated/candidates.json'))
          summary=json.load(open('/tmp/batch2-generated/summary.json'))

          old_maps={m['sourceKey']:m['vehicleModelKey'] for m in base_map['mappings']}
          new_maps={m['sourceKey']:m['vehicleModelKey'] for m in new_map['mappings']}
          assert len(old_maps)==871
          assert len(new_maps)==935
          assert all(new_maps.get(k)==v for k,v in old_maps.items())
          added_keys=sorted(set(new_maps)-set(old_maps))
          assert len(added_keys)==64

          old_models={m['key']:m for m in base_cat['models']}
          new_models={m['key']:m for m in new_cat['models']}
          assert len(old_models)==621
          assert len(new_models)==656
          assert all(new_models.get(k)==v for k,v in old_models.items())
          added_models=sorted(set(new_models)-set(old_models))
          assert len(added_models)==35

          by_series=Counter()
          for k in added_keys:
            target=new_maps[k]
            if target.startswith('opel:corsa:'): by_series['opel:corsa'] += 1
            elif target.startswith('volkswagen:passat:'): by_series['volkswagen:passat'] += 1
            else: raise AssertionError((k,target))
          assert by_series==Counter({'volkswagen:passat':36,'opel:corsa':28}), by_series

          forbidden=[]
          for c in candidates:
            if c.get('modelStatus')!='mapped' or c.get('sourceKey') not in added_keys: continue
            raw=(c.get('typeRaw') or '').upper()
            if any(t in raw for t in ['CORSA-E',' CORSA E ',' VAN ','PASSAT VARIANT','ALLTRACK',' GTE ',' PASSAT CC ','1.5 ETSI','1.5 E-TSI']):
              forbidden.append(c)
          assert not forbidden, forbidden

          expected={
            'sourceRecords':27906,
            'exactCandidates':935,
            'mappedSourceCodes':935,
            'canonicalBrands':20,
            'canonicalSeries':62,
            'canonicalModels':656,
            'slugCollisionsExcluded':0,
            'ambiguousSeriesExcluded':21,
            'unknownBrandExcluded':13955,
            'noSeriesExcluded':7051,
            'modelReviewRequired':5944,
          }
          for k,v in expected.items(): assert summary[k]==v,(k,summary[k],v)

          shutil.copyfile('/tmp/batch2-generated/catalog.generated.json','data/reference/vehicles/catalog.json')
          shutil.copyfile('/tmp/batch2-generated/tsb-mappings.generated.json','data/reference/vehicles/tsb-mappings.json')

          # Update backlog from the same generated candidate set while preserving existing ordering.
          backlog_path='data/reference/vehicles/curation-backlog.json'
          backlog=json.load(open(backlog_path))
          series_counts=defaultdict(lambda: {'sourceRecords':0,'mappedSourceCodes':0,'modelReviewRequired':0,'excludedSourceCodes':0})
          for c in candidates:
            sk=c.get('seriesKeyCandidate')
            if not sk: continue
            row=series_counts[sk]
            row['sourceRecords'] += 1
            status=c.get('modelStatus')
            if status=='mapped': row['mappedSourceCodes'] += 1
            elif status=='model-review': row['modelReviewRequired'] += 1
            elif status=='excluded': row['excludedSourceCodes'] += 1
          selectable=Counter(m['seriesKey'] for m in new_cat['models'])
          computed={sk:{'seriesKey':sk,**vals,'selectableModels':selectable.get(sk,0)} for sk,vals in series_counts.items()}
          seen=set()
          rows=[]
          for old in backlog['series']:
            sk=old['seriesKey']
            if sk in computed:
              rows.append(computed[sk]); seen.add(sk)
            else:
              rows.append(old)
          for sk in sorted(set(computed)-seen): rows.append(computed[sk])
          backlog['version']='2026-09-13.2'
          backlog['sourceRecords']=summary['sourceRecords']
          backlog['unassignedByReason']={
            'ambiguous-series':summary['ambiguousSeriesExcluded'],
            'no-series':summary['noSeriesExcluded'],
            'unknown-brand':summary['unknownBrandExcluded'],
          }
          backlog['series']=rows
          json.dump(backlog,open(backlog_path,'w'),ensure_ascii=False,indent=2); open(backlog_path,'a').write('\n')

          # Update manifest counts and evidence without hand-maintained statistics.
          manifest_path='data/reference/vehicles/source-manifest.json'
          manifest=json.load(open(manifest_path))
          manifest['version']='2026-09-13.2'
          for src in manifest.get('sources',[]):
            if src.get('role')=='turkey-coverage':
              src['normalizedSnapshotSha256']='d810927023cc1fe50b457c83dec3b3dd485cee0f110f2a6b6d476c25d33c2b11'
          cur=manifest['curation']
          for key in ['sourceRecords','exactCandidates','mappedSourceCodes','canonicalBrands','canonicalSeries','canonicalModels','slugCollisionsExcluded','ambiguousSeriesExcluded','unknownBrandExcluded','noSeriesExcluded','modelReviewRequired']:
            cur[key]=summary[key]
          cur['tsbSnapshotRecords']=summary['sourceRecords']
          sentence=' Opel Corsa and Volkswagen Passat use marketplace-evidenced source-code allowlists; Corsa 1.2 turbo power variants and Passat BlueMotion engine branches are normalized explicitly while distinct body/nameplate branches remain review-only.'
          if sentence.strip() not in cur['method']:
            cur['method']=cur['method'].rstrip()+sentence
          gap='Corsa-e/Van and Passat Variant/Alltrack/GTE/CC/eTSI branches remain review-only or separate nameplate/body work until independently evidenced.'
          if gap not in cur['knownGaps']: cur['knownGaps'].append(gap)
          for example in ['Opel/Corsa/1.2 T/Edition','Volkswagen/Passat/1.6 TDI BlueMotion/Comfortline']:
            if example not in cur['reviewedReferenceExamples']: cur['reviewedReferenceExamples'].append(example)
          for sk in ['opel:corsa','volkswagen:passat']:
            if sk not in cur['reviewedTechnicalPolicySeries']: cur['reviewedTechnicalPolicySeries'].append(sk)

          # Recompute per-known-brand coverage from generated candidates/catalog.
          brand_counts=defaultdict(lambda: Counter(sourceRows=0,mapped=0,model_review=0,excluded=0))
          for c in candidates:
            bk=c.get('brandKeyCandidate')
            if not bk: continue
            cnt=brand_counts[bk]; cnt['sourceRows'] += 1
            status=c.get('modelStatus')
            if status=='mapped': cnt['mapped'] += 1
            elif status=='model-review': cnt['model_review'] += 1
            elif status=='excluded': cnt['excluded'] += 1
          series_brand={s['key']:s['brandKey'] for s in new_cat['series']}
          leaves=Counter(series_brand[m['seriesKey']] for m in new_cat['models'])
          new_coverage=[]
          for old in cur['coverageByKnownBrand']:
            bk=old['brandKey']; cnt=brand_counts[bk]
            row={'brandKey':bk,'sourceRows':cnt['sourceRows']}
            if cnt['model_review']: row['model-review']=cnt['model_review']
            if cnt['excluded']: row['excluded']=cnt['excluded']
            if cnt['mapped']: row['mapped']=cnt['mapped']
            row['selectableLeaves']=leaves.get(bk,0)
            new_coverage.append(row)
          cur['coverageByKnownBrand']=new_coverage
          json.dump(manifest,open(manifest_path,'w'),ensure_ascii=False,indent=2); open(manifest_path,'a').write('\n')

          # High-value exact metadata assertions.
          corsa=next(x for x in backlog['series'] if x['seriesKey']=='opel:corsa')
          passat=next(x for x in backlog['series'] if x['seriesKey']=='volkswagen:passat')
          assert corsa=={'seriesKey':'opel:corsa','sourceRecords':135,'mappedSourceCodes':28,'modelReviewRequired':107,'excludedSourceCodes':0,'selectableModels':19}, corsa
          assert passat=={'seriesKey':'volkswagen:passat','sourceRecords':126,'mappedSourceCodes':36,'modelReviewRequired':90,'excludedSourceCodes':0,'selectableModels':16}, passat
          PY
          rm .github/workflows/vehicle-batch2-repro-once.yml
          rm .github/workflows/vehicle-batch2-materialize-once.yml
          git diff --check
          python -m json.tool data/reference/vehicles/catalog.json >/dev/null
          python -m json.tool data/reference/vehicles/tsb-mappings.json >/dev/null
          python -m json.tool data/reference/vehicles/source-manifest.json >/dev/null
          python -m json.tool data/reference/vehicles/curation-backlog.json >/dev/null
      - name: Commit verified generated artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/reference/vehicles/catalog.json \
                  data/reference/vehicles/tsb-mappings.json \
                  data/reference/vehicles/source-manifest.json \
                  data/reference/vehicles/curation-backlog.json \
                  .github/workflows/vehicle-batch2-repro-once.yml \
                  .github/workflows/vehicle-batch2-materialize-once.yml
          git commit -m 'data: materialize reviewed Corsa and Passat batch'
          git push origin HEAD:feat/vehicle-curation-policy-batch-2-materialize-safety
