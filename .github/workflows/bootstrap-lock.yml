name: Bootstrap lockfile

on:
  push:
    branches: [feat/foundation]

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - run: pnpm install
      - run: pnpm contracts:build
      - run: pnpm --filter @bizzat/contracts typecheck
      - run: pnpm --filter @bizzat/contracts lint
      - name: Commit generated lockfile and remove bootstrap workflow
        run: |
          rm .github/workflows/bootstrap-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml .github/workflows/bootstrap-lock.yml
          git commit -m "chore: commit generated pnpm lockfile"
          git push
