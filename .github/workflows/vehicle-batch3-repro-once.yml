name: Vehicle Batch3 Repro Once

on:
  push:
    branches:
      - feat/vehicle-curation-policy-batch-3

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Acquire August 2026 TSB snapshot
        run: |
          python -m pip install --disable-pip-version-check requests openpyxl
          curl -fsSL \
            https://raw.githubusercontent.com/mehmetcaloglu/bizzat/b9ae77a6afa57dd3c64b36de6324af13561d7df5/scripts/maintenance/acquire-tsb-source.py \
            -o /tmp/acquire-tsb-source.py
          for attempt in 1 2 3 4; do
            if python /tmp/acquire-tsb-source.py --year 2026 --month 8 --output /tmp/tsb.normalized.json; then
              break
            fi
            if [ "$attempt" = 4 ]; then exit 1; fi
            sleep $((attempt * 5))
          done
          python - <<'PY'
          import hashlib, json
          p='/tmp/tsb.normalized.json'
          raw=open(p,'rb').read()
          data=json.loads(raw)
          assert data['provider']['version']=='2026-08'
          assert len(data['records'])==27906
          report={'period':data['provider']['version'],'rows':len(data['records']),'sha256':hashlib.sha256(raw).hexdigest()}
          json.dump(report,open('/tmp/batch3-source.json','w'),indent=2)
          print(json.dumps(report))
          PY
      - name: Build baseline bootstrap
        run: |
          python - <<'PY'
          import json
          cat=json.load(open('data/reference/vehicles/catalog.json'))
          brands={b['key']:b['name'] for b in cat['brands']}
          out={}
          for s in cat['series']:
            out.setdefault(brands[s['brandKey']],[]).append(s['name'])
          for values in out.values(): values.sort()
          json.dump(out,open('/tmp/bootstrap.json','w'),ensure_ascii=False,indent=2)
          PY
      - name: Regenerate against reviewed baseline
        run: |
          pnpm reference:generate:vehicle-catalog -- \
            /tmp/tsb.normalized.json \
            data/reference/vehicles/brand-aliases.json \
            data/reference/vehicles/series-aliases.json \
            /tmp/bootstrap.json \
            /tmp/batch3-generated \
            2026-09-14.3 \
            data/reference/vehicles
      - name: Audit full-source delta
        run: |
          python - <<'PY'
          import json
          base_cat=json.load(open('data/reference/vehicles/catalog.json'))
          base_map=json.load(open('data/reference/vehicles/tsb-mappings.json'))
          new_cat=json.load(open('/tmp/batch3-generated/catalog.generated.json'))
          new_map=json.load(open('/tmp/batch3-generated/tsb-mappings.generated.json'))
          candidates=json.load(open('/tmp/batch3-generated/candidates.json'))
          summary=json.load(open('/tmp/batch3-generated/summary.json'))
          source=json.load(open('/tmp/batch3-source.json'))

          old_maps={m['sourceKey']:m['vehicleModelKey'] for m in base_map['mappings']}
          new_maps={m['sourceKey']:m['vehicleModelKey'] for m in new_map['mappings']}
          old_models={m['key']:m for m in base_cat['models']}
          new_models={m['key']:m for m in new_cat['models']}
          assert len(old_maps)==935, len(old_maps)
          assert len(old_models)==656, len(old_models)

          changed_maps={k:(v,new_maps.get(k)) for k,v in old_maps.items() if new_maps.get(k)!=v}
          assert not changed_maps, changed_maps
          changed_models={k:(v,new_models.get(k)) for k,v in old_models.items() if new_models.get(k)!=v}
          assert not changed_models, list(changed_models)[:10]

          added_keys=sorted(set(new_maps)-set(old_maps))
          added=[{'sourceKey':k,'vehicleModelKey':new_maps[k]} for k in added_keys]
          allowed_prefixes=('volkswagen:jetta:','fiat:linea:')
          assert all(x['vehicleModelKey'].startswith(allowed_prefixes) for x in added), added
          assert len(added) <= 84, len(added)

          excluded_jetta={'153-1540','153-1547','153-1602'}
          assert not (excluded_jetta & set(new_maps)), sorted(excluded_jetta & set(new_maps))

          by_source={c.get('sourceKey'):c for c in candidates if c.get('sourceKey')}
          jetta=[x for x in added if x['vehicleModelKey'].startswith('volkswagen:jetta:')]
          linea=[x for x in added if x['vehicleModelKey'].startswith('fiat:linea:')]

          for x in jetta:
            c=by_source[x['sourceKey']]
            raw=(c.get('typeRaw') or '').upper()
            target=x['vehicleModelKey']
            has_evidence=(' BMT ' in f' {raw} ' or 'BLUEMOTION' in raw)
            is_bluemotion='-bluemotion-' in target
            assert is_bluemotion == has_evidence, (x, raw)

          for x in linea:
            c=by_source[x['sourceKey']]
            raw=(c.get('typeRaw') or '').upper()
            target=x['vehicleModelKey']
            if 'T-JET' in raw:
              assert ':1-4-turbo-' in target, (x, raw)
            if 'VIA' in raw.split():
              assert target.startswith('fiat:linea:'), (x, raw)

          # Scoped normalizers must not create any new mapping outside the two reviewed series.
          outside_added=[x for x in added if not x['vehicleModelKey'].startswith(allowed_prefixes)]
          assert not outside_added, outside_added

          added_models=sorted(set(new_models)-set(old_models))
          model_rows=[new_models[k] for k in added_models]
          assert all(m['seriesKey'] in {'volkswagen:jetta','fiat:linea'} for m in model_rows), model_rows

          model_review_after=sum(1 for c in candidates if c.get('modelStatus')=='model-review')
          model_review_before=5944
          assert model_review_after <= model_review_before, (model_review_before, model_review_after)

          def leaves(rows):
            return sorted({tuple(node['name'] for node in m['selectionPath']) for m in rows})
          jetta_models=[m for m in model_rows if m['seriesKey']=='volkswagen:jetta']
          linea_models=[m for m in model_rows if m['seriesKey']=='fiat:linea']

          report={
            'source':source,
            'summary':summary,
            'baselineMappings':len(old_maps),
            'newMappings':len(new_maps),
            'addedMappings':len(added),
            'baselineModels':len(old_models),
            'newModels':len(new_models),
            'addedModels':len(added_models),
            'modelReviewBefore':model_review_before,
            'modelReviewAfter':model_review_after,
            'jetta':{'mappings':len(jetta),'leaves':leaves(jetta_models),'sourceKeys':[x['sourceKey'] for x in jetta]},
            'linea':{'mappings':len(linea),'leaves':leaves(linea_models),'sourceKeys':[x['sourceKey'] for x in linea]},
            'added':added,
            'addedModelRows':model_rows,
            'excludedJetta':sorted(excluded_jetta),
          }
          json.dump(report,open('/tmp/batch3-delta.json','w'),ensure_ascii=False,indent=2)
          print(json.dumps(report,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vehicle-batch3-repro
          path: |
            /tmp/batch3-generated/catalog.generated.json
            /tmp/batch3-generated/tsb-mappings.generated.json
            /tmp/batch3-generated/candidates.json
            /tmp/batch3-generated/summary.json
            /tmp/batch3-delta.json
            /tmp/batch3-source.json
          retention-days: 1
