name: Vehicle Batch3 Tail Audit Once

on:
  push:
    branches:
      - feat/vehicle-curation-policy-batch-3

permissions:
  contents: read

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Acquire August 2026 TSB snapshot
        run: |
          python -m pip install --disable-pip-version-check requests openpyxl
          curl -fsSL \
            https://raw.githubusercontent.com/mehmetcaloglu/bizzat/b9ae77a6afa57dd3c64b36de6324af13561d7df5/scripts/maintenance/acquire-tsb-source.py \
            -o /tmp/acquire-tsb-source.py
          python /tmp/acquire-tsb-source.py --year 2026 --month 8 --output /tmp/tsb.normalized.json
      - name: Build baseline bootstrap and regenerate
        run: |
          python - <<'PY'
          import json
          cat=json.load(open('data/reference/vehicles/catalog.json'))
          brands={b['key']:b['name'] for b in cat['brands']}
          out={}
          for s in cat['series']:
            out.setdefault(brands[s['brandKey']],[]).append(s['name'])
          for values in out.values(): values.sort()
          json.dump(out,open('/tmp/bootstrap.json','w'),ensure_ascii=False,indent=2)
          PY
          pnpm reference:generate:vehicle-catalog -- \
            /tmp/tsb.normalized.json \
            data/reference/vehicles/brand-aliases.json \
            data/reference/vehicles/series-aliases.json \
            /tmp/bootstrap.json \
            /tmp/batch3-tail \
            2026-09-14.3 \
            data/reference/vehicles
      - name: Print reviewed-but-unmapped tail
        run: |
          python - <<'PY'
          import json
          tail=['153-620','153-625','153-626','153-756','153-906','153-907','153-992','100-452']
          candidates=json.load(open('/tmp/batch3-tail/candidates.json'))
          source=json.load(open('/tmp/tsb.normalized.json'))
          by_candidate={c.get('sourceKey'):c for c in candidates if c.get('sourceKey')}
          by_source={r.get('sourceKey'):r for r in source['records'] if r.get('sourceKey')}
          rows=[]
          for key in tail:
            rows.append({'sourceKey':key,'source':by_source.get(key),'candidate':by_candidate.get(key)})
          print('BATCH3_TAIL_AUDIT='+json.dumps(rows,ensure_ascii=False,sort_keys=True))
          PY
