name: Vehicle B2 Repro Verify

on:
  push:
    branches: [feat/vehicle-catalog-phase-b2]
    paths:
      - .github/workflows/vehicle-b2-repro-verify.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Restore exact historical acquisition script
        run: git show b9ae77a6afa57dd3c64b36de6324af13561d7df5:scripts/maintenance/acquire-tsb-source.py > /tmp/acquire-tsb-source.py

      - name: Install acquisition dependencies
        run: python -m pip install --disable-pip-version-check requests openpyxl

      - name: Reacquire August 2026 normalized TSB snapshot
        run: python /tmp/acquire-tsb-source.py --year 2026 --month 8 --output /tmp/tsb.normalized.json

      - name: Verify record count and exact normalized checksum
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          path = Path('/tmp/tsb.normalized.json')
          payload = path.read_bytes()
          data = json.loads(payload)
          digest = hashlib.sha256(payload).hexdigest()
          count = len(data['records'])
          version = data['provider']['version']
          print(json.dumps({'version': version, 'records': count, 'sha256': digest}, ensure_ascii=False))
          assert version == '2026-08', version
          assert count == 27906, count
          assert digest == '768140c3952ced1eb614eb0dfb57c519e6b127109591b862d629adf84d34b550', digest
          PY

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Install repository dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch pinned bootstrap dataset
        run: curl --fail --silent --show-error --location https://raw.githubusercontent.com/serhatkildaci/global-car-models/44da5c9e5e0f3162d65579033f7a641473308b11/data/models.json --output /tmp/global-car-models.json

      - name: Full regenerate from exact snapshot and reviewed baseline
        run: >-
          pnpm reference:generate:vehicle-catalog --
          /tmp/tsb.normalized.json
          data/reference/vehicles/brand-aliases.json
          data/reference/vehicles/series-aliases.json
          /tmp/global-car-models.json
          /tmp/bizzat-full-regeneration
          2026-09-10.3
          data/reference/vehicles

      - name: Diagnose regeneration differences
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          committed_catalog = json.loads(Path('data/reference/vehicles/catalog.json').read_text())
          generated_catalog = json.loads(Path('/tmp/bizzat-full-regeneration/catalog.generated.json').read_text())
          committed_mappings = json.loads(Path('data/reference/vehicles/tsb-mappings.json').read_text())
          generated_mappings = json.loads(Path('/tmp/bizzat-full-regeneration/tsb-mappings.generated.json').read_text())
          summary = json.loads(Path('/tmp/bizzat-full-regeneration/summary.json').read_text())

          def compare_keyed(section):
              old_items = committed_catalog[section]
              new_items = generated_catalog[section]
              old = {item['key']: item for item in old_items}
              new = {item['key']: item for item in new_items}
              added = sorted(set(new) - set(old))
              removed = sorted(set(old) - set(new))
              changed = sorted(key for key in set(old) & set(new) if old[key] != new[key])
              order = []
              for index, (left, right) in enumerate(zip([x['key'] for x in old_items], [x['key'] for x in new_items])):
                  if left != right:
                      order.append({'index': index, 'committed': left, 'generated': right})
                      if len(order) == 10:
                          break
              return {'added': added, 'removed': removed, 'changed': changed, 'orderMismatch': order}

          old_map = {item['sourceKey']: item for item in committed_mappings['mappings']}
          new_map = {item['sourceKey']: item for item in generated_mappings['mappings']}
          map_added = [new_map[key] for key in sorted(set(new_map) - set(old_map))]
          map_removed = [old_map[key] for key in sorted(set(old_map) - set(new_map))]
          map_changed = [
              {'sourceKey': key, 'committed': old_map[key], 'generated': new_map[key]}
              for key in sorted(set(old_map) & set(new_map))
              if old_map[key] != new_map[key]
          ]

          report = {
              'summary': summary,
              'brands': compare_keyed('brands'),
              'series': compare_keyed('series'),
              'models': compare_keyed('models'),
              'mappingAdded': map_added,
              'mappingRemoved': map_removed,
              'mappingChanged': map_changed,
          }
          print(json.dumps(report, ensure_ascii=False, indent=2))

          same_catalog = Path('data/reference/vehicles/catalog.json').read_bytes() == Path('/tmp/bizzat-full-regeneration/catalog.generated.json').read_bytes()
          same_mappings = Path('data/reference/vehicles/tsb-mappings.json').read_bytes() == Path('/tmp/bizzat-full-regeneration/tsb-mappings.generated.json').read_bytes()
          print(json.dumps({'catalogByteEqual': same_catalog, 'mappingsByteEqual': same_mappings}))
          raise SystemExit(0 if same_catalog and same_mappings else 1)
          PY
