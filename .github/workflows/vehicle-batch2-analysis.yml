name: Vehicle Batch2 Analysis

on:
  push:
    branches:
      - feat/vehicle-curation-policy-batch-2-analysis

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Acquire August 2026 TSB snapshot
        run: |
          python -m pip install --disable-pip-version-check requests openpyxl
          curl -fsSL \
            https://raw.githubusercontent.com/mehmetcaloglu/bizzat/b9ae77a6afa57dd3c64b36de6324af13561d7df5/scripts/maintenance/acquire-tsb-source.py \
            -o /tmp/acquire-tsb-source.py
          python /tmp/acquire-tsb-source.py --year 2026 --month 8 --output /tmp/tsb.normalized.json
      - name: Build targeted raw report
        run: |
          python - <<'PY'
          import json, re
          from collections import Counter

          src = json.load(open('/tmp/tsb.normalized.json', encoding='utf-8'))
          assert src['provider']['version'] == '2026-08'
          assert len(src['records']) == 27906

          targets = {
            'opel:corsa': ('OPEL', re.compile(r'^CORSA(?:\b|-)', re.I)),
            'opel:insignia': ('OPEL', re.compile(r'^INSIGNIA\b', re.I)),
            'volkswagen:passat': ('VOLKSWAGEN', re.compile(r'^PASSAT\b', re.I)),
          }
          branch_terms = [
            'SEDAN','HB','HATCHBACK','NB','SW','ST','SPORTS TOURER','COUNTRY TOURER',
            'TOURER','VARIANT','CC','ALLTRACK','GTE','VAN','3 KAPI','5 KAPI','3D','5D',
            '4X4','4X2','AWD','OPC','GSI','ELECTRIC','ELEKTRIK','CORSA-E'
          ]
          tech_terms = ['CDTI','ECOTEC','TURBO','TDI','TSI','DSG','TIPTRONIC','EDITION','ELEGANCE','COSMO','ENJOY','SPORT','STYLE','COMFORTLINE','HIGHLINE','TRENDLINE','EXCLUSIVE','DESIGN','ULTIMATE','BUSINESS','INNOVATION']

          out = {'provider': src['provider'], 'recordCount': len(src['records']), 'targets': {}}
          for key, (brand, rx) in targets.items():
            rows = []
            for r in src['records']:
              b = (r.get('brandRaw') or '').upper()
              t = (r.get('typeRaw') or '').strip()
              if brand in b and rx.search(t):
                rows.append({
                  'sourceKey': r['sourceKey'],
                  'brandRaw': r.get('brandRaw'),
                  'typeRaw': t,
                  'availableModelYears': r.get('availableModelYears', []),
                })
            rows.sort(key=lambda x: x['sourceKey'])
            branch_counts = {term: sum(term in row['typeRaw'].upper() for row in rows) for term in branch_terms}
            branch_counts = {k:v for k,v in branch_counts.items() if v}
            tech_counts = {term: sum(term in row['typeRaw'].upper() for row in rows) for term in tech_terms}
            tech_counts = {k:v for k,v in tech_counts.items() if v}
            token_counts = Counter()
            for row in rows:
              token_counts.update(re.findall(r'[A-ZÇĞİÖŞÜ0-9.+-]+', row['typeRaw'].upper()))
            out['targets'][key] = {
              'count': len(rows),
              'branchTermCounts': branch_counts,
              'commonTokens': token_counts.most_common(60),
              'techTermCounts': tech_counts,
              'rows': rows,
            }
            print(key, len(rows), branch_counts)
          json.dump(out, open('/tmp/vehicle-batch2-analysis.json','w',encoding='utf-8'), ensure_ascii=False, indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vehicle-batch2-analysis
          path: /tmp/vehicle-batch2-analysis.json
          retention-days: 1
