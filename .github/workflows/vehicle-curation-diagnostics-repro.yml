name: Vehicle Curation Diagnostics Repro

on:
  push:
    branches:
      - feat/vehicle-curation-diagnostics

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Reacquire current August 2026 TSB snapshot
        run: |
          python -m pip install --disable-pip-version-check requests openpyxl
          curl -fsSL \
            https://raw.githubusercontent.com/mehmetcaloglu/bizzat/b9ae77a6afa57dd3c64b36de6324af13561d7df5/scripts/maintenance/acquire-tsb-source.py \
            -o /tmp/acquire-tsb-source.py
          python /tmp/acquire-tsb-source.py \
            --year 2026 \
            --month 8 \
            --output /tmp/tsb.normalized.json
          python - <<'PY'
          import hashlib, json
          path = '/tmp/tsb.normalized.json'
          raw = open(path, 'rb').read()
          data = json.loads(raw)
          digest = hashlib.sha256(raw).hexdigest()
          expected = '768140c3952ced1eb614eb0dfb57c519e6b127109591b862d629adf84d34b550'
          assert data['provider']['version'] == '2026-08', data['provider']['version']
          assert len(data['records']) == 27906, len(data['records'])
          print(json.dumps({
            'version': data['provider']['version'],
            'records': len(data['records']),
            'currentSha256': digest,
            'recordedSha256': expected,
            'sourceByteEqual': digest == expected,
          }))
          PY

      - name: Fetch pinned bootstrap
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/serhatkildaci/global-car-models/44da5c9e5e0f3162d65579033f7a641473308b11/data/models.json \
            -o /tmp/bootstrap-models.json

      - name: Full regenerate with reviewed baseline
        run: |
          pnpm reference:generate:vehicle-catalog -- \
            /tmp/tsb.normalized.json \
            data/reference/vehicles/brand-aliases.json \
            data/reference/vehicles/series-aliases.json \
            /tmp/bootstrap-models.json \
            /tmp/vehicle-curation-diagnostics-repro \
            2026-09-10.3 \
            data/reference/vehicles

      - name: Compare revised source result with committed artifacts
        run: |
          cmp /tmp/vehicle-curation-diagnostics-repro/catalog.generated.json data/reference/vehicles/catalog.json
          cmp /tmp/vehicle-curation-diagnostics-repro/tsb-mappings.generated.json data/reference/vehicles/tsb-mappings.json
          echo 'catalogByteEqual=true'
          echo 'mappingsByteEqual=true'
          echo 'diagnosticSummary:'
          cat /tmp/vehicle-curation-diagnostics-repro/summary.json
