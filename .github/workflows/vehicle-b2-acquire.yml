name: Vehicle B2 Acquire

on:
  push:
    branches: [feat/vehicle-catalog-phase-b2]
    paths:
      - scripts/maintenance/acquire-tsb-source.py
      - scripts/maintenance/build-b2-catalog.py
      - .github/workflows/vehicle-b2-acquire.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  acquire:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: bizzat
          POSTGRES_PASSWORD: bizzat_ci
          POSTGRES_DB: bizzat_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U bizzat -d bizzat_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://bizzat:bizzat_ci@127.0.0.1:5432/bizzat_test
      DATABASE_URL: postgresql://bizzat:bizzat_ci@127.0.0.1:5432/bizzat_test
      NODE_ENV: test
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: bizzat-ci-auth-secret-00000000000001
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vehicle-catalog-phase-b2
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: python -m pip install --disable-pip-version-check requests openpyxl
      - name: Acquire price-free normalized TSB snapshot
        run: python scripts/maintenance/acquire-tsb-source.py --year 2026 --month 9 --output /tmp/tsb.normalized.json
      - name: Build deterministic curated repository data
        run: python scripts/maintenance/build-b2-catalog.py /tmp/tsb.normalized.json /tmp/b2-data
      - name: Copy curated outputs into repository
        run: |
          mkdir -p data/reference/vehicles
          cp /tmp/b2-data/{brand-aliases,series-aliases,catalog,tsb-mappings,source-manifest}.json data/reference/vehicles/
      - name: Flatten canonical catalog to Phase A contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/reference/vehicles/catalog.json')
          nested=json.loads(p.read_text(encoding='utf-8'))
          brands=[]; series=[]; models=[]
          for brand in nested['brands']:
              brands.append({'key':brand['key'],'name':brand['name']})
              for item in brand['series']:
                  series.append({'key':item['key'],'brandKey':brand['key'],'name':item['name']})
                  for model in item['models']:
                      models.append({'key':model['key'],'seriesKey':item['key'],'name':model['name']})
          flat={'version':nested['version'],'brands':brands,'series':series,'models':models}
          p.write_text(json.dumps(flat,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print({'brands':len(brands),'series':len(series),'models':len(models)})
          PY
      - uses: pnpm/action-setup@v4
        with: { version: 10.34.5, run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version: 24.20.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bizzat/api db:migrate:raw
      - name: Validate canonical catalog
        run: pnpm reference:import:vehicle-catalog -- data/reference/vehicles/catalog.json
      - name: Validate real source and mappings
        run: |
          pnpm reference:import:vehicle-source -- tsb /tmp/tsb.normalized.json
          pnpm reference:apply:vehicle-mappings -- tsb data/reference/vehicles/tsb-mappings.json
          pnpm reference:report:vehicle-source -- tsb
      - name: Assert normalized artifact has no price fields
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/tsb.normalized.json').read_text())
          assert d['records']
          assert all(set(r)=={'sourceKey','brandRaw','typeRaw','availableModelYears'} for r in d['records'])
          print({'version':d['provider']['version'],'records':len(d['records'])})
          PY
      - name: Commit deterministic permanent data
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/reference/vehicles/brand-aliases.json data/reference/vehicles/series-aliases.json data/reference/vehicles/catalog.json data/reference/vehicles/tsb-mappings.json data/reference/vehicles/source-manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: populate Turkish automobile catalog"
          git push origin HEAD:feat/vehicle-catalog-phase-b2
      - uses: actions/upload-artifact@v4
        with:
          name: vehicle-b2-tsb-normalized
          path: /tmp/tsb.normalized.json
          retention-days: 1
          if-no-files-found: error
