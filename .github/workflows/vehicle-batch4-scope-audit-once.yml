name: Vehicle Batch4 Scope Audit Once

on:
  push:
    branches:
      - feat/vehicle-curation-policy-batch-4

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Acquire August 2026 TSB snapshot
        run: |
          python -m pip install --disable-pip-version-check requests openpyxl
          curl -fsSL \
            https://raw.githubusercontent.com/mehmetcaloglu/bizzat/b9ae77a6afa57dd3c64b36de6324af13561d7df5/scripts/maintenance/acquire-tsb-source.py \
            -o /tmp/acquire-tsb-source.py
          python /tmp/acquire-tsb-source.py --year 2026 --month 8 --output /tmp/tsb.normalized.json
      - name: Regenerate current candidates
        run: |
          python - <<'PY'
          import json
          cat=json.load(open('data/reference/vehicles/catalog.json'))
          brands={b['key']:b['name'] for b in cat['brands']}
          out={}
          for s in cat['series']:
            out.setdefault(brands[s['brandKey']],[]).append(s['name'])
          for values in out.values(): values.sort()
          json.dump(out,open('/tmp/bootstrap.json','w'),ensure_ascii=False,indent=2)
          PY
          pnpm reference:generate:vehicle-catalog -- \
            /tmp/tsb.normalized.json \
            data/reference/vehicles/brand-aliases.json \
            data/reference/vehicles/series-aliases.json \
            /tmp/bootstrap.json \
            /tmp/batch4-audit \
            2026-09-14.4-audit \
            data/reference/vehicles
      - name: Print candidate shapes for high-leverage series
        run: |
          python - <<'PY'
          import json, collections
          targets=['hyundai:i20','honda:civic','ford:fiesta','renault:fluence']
          candidates=json.load(open('/tmp/batch4-audit/candidates.json'))
          source=json.load(open('/tmp/tsb.normalized.json'))
          years={r['sourceKey']:r.get('availableModelYears',[]) for r in source['records']}
          for series in targets:
            rows=[c for c in candidates if c.get('seriesKeyCandidate')==series]
            print(f'=== {series} rows={len(rows)} mapped={sum(c.get("modelStatus")=="exact-model" for c in rows)} review={sum(c.get("modelStatus")=="model-review" for c in rows)} ===')
            groups=collections.defaultdict(lambda:{'keys':[],'years':set()})
            for c in rows:
              sig=(c.get('typeRaw'),c.get('proposedModelLabel'),c.get('reviewReason'),c.get('modelStatus'))
              groups[sig]['keys'].append(c.get('sourceKey'))
              groups[sig]['years'].update(years.get(c.get('sourceKey'),[]))
            for sig,data in sorted(groups.items(), key=lambda item: (item[0][3] or '', item[0][2] or '', item[0][0] or '')):
              type_raw, proposed, reason, status=sig
              print(json.dumps({'status':status,'reason':reason,'typeRaw':type_raw,'proposed':proposed,'sourceKeys':data['keys'],'years':sorted(data['years'])},ensure_ascii=False,sort_keys=True))
          PY
