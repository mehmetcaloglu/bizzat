name: Vehicle Batch4 TDD Once

on:
  push:
    branches:
      - feat/vehicle-curation-policy-batch-4

permissions:
  contents: read

jobs:
  focused-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bizzat/api exec vitest run test/vehicle-curation-i20-fluence-policy.test.ts
