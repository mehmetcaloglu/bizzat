name: Vehicle Batch4 Implement Once

on:
  push:
    branches:
      - feat/vehicle-curation-policy-batch-4

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vehicle-curation-policy-batch-4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply reviewed i20 and Fluence policies
        run: |
          python - <<'PY'
          from pathlib import Path

          model = Path('apps/api/src/reference/vehicle/curation/model-label.ts')
          text = model.read_text()
          old = "  'D-4D': 'D-4D', 'I-DTEC': 'i-DTEC', 'I-VTEC': 'i-VTEC', VTEC: 'VTEC', CRDI: 'CRDi', GDI: 'GDi', 'T-GDI': 'T-GDi',"
          new = "  'D-4D': 'D-4D', 'I-DTEC': 'i-DTEC', 'I-VTEC': 'i-VTEC', VTEC: 'VTEC', 'D-CVVT': 'D-CVVT', CVVT: 'CVVT', CRDI: 'CRDi', GDI: 'GDi', 'T-GDI': 'T-GDi',"
          assert old in text
          text = text.replace(old, new, 1)

          old = "  'volkswagen:jetta': {},\n  'fiat:linea': {},\n}"
          new = "  'volkswagen:jetta': {},\n  'fiat:linea': {},\n  'hyundai:i20': {},\n  'renault:fluence': {},\n}"
          assert old in text
          text = text.replace(old, new, 1)

          old = "  if (seriesKey === 'fiat:linea') {\n    label = label.replace(/\\b(?:DUALOGIC|DUALO|DUAL)\\b/g, ' ')\n  }\n\n  let group = ''"
          new = "  if (seriesKey === 'fiat:linea') {\n    label = label.replace(/\\b(?:DUALOGIC|DUALO|DUAL)\\b/g, ' ')\n  }\n  if (seriesKey === 'hyundai:i20') {\n    label = label\n      .replace(/\\b1\\.0T\\b/g, '1.0 T-GDI')\n      .replace(/\\b1\\.0\\s+T\\b(?!-GDI)/g, '1.0 T-GDI')\n      .replace(/\\b(?:7DCT|6AT|6MT)\\b/g, ' ')\n  }\n\n  let group = ''"
          assert old in text
          text = text.replace(old, new, 1)
          model.write_text(text)

          scope = Path('apps/api/src/reference/vehicle/curation/reviewed-source-scope.ts')
          text = scope.read_text()
          marker = "  'fiat:linea': new Set([\n    '100-1009','100-1010','100-1011','100-1012','100-1013','100-1014','100-1015','100-1016','100-1017',\n    '100-1020','100-1021','100-1022','100-1040','100-1041','100-1042','100-1043','100-1044','100-1045',\n    '100-1066','100-1067','100-1094','100-1095','100-1110','100-1136','100-1137','100-1144','100-1145',\n    '100-452','100-488','100-490','100-491','100-492','100-493','100-494','100-495','100-496','100-497','100-498','100-499','100-500','100-501',\n  ]),\n"
          assert marker in text

          i20 = [
            '177-1184','177-1181','177-1091','177-1088','177-1089','177-281',
            '177-1037','177-1179','177-1178','177-1034','177-1035','177-1036',
            '177-1403','177-1401','177-1402','177-1285','177-1286','177-1282','177-1284',
            '177-1351','177-1349','177-1350','177-1374','177-1372','177-1373','177-1400',
            '177-1280','177-1281','177-1276','177-1274','177-1277','177-1275','177-1279',
            '177-1348','177-1346','177-1347','177-1096','177-1093','177-1185','177-1094',
            '177-1371','177-1345','177-1211','177-1212',
            '177-1098','177-1099','177-286','177-287','177-288',
          ]
          fluence = [
            '122-513','122-573','122-527','122-1123','122-1065','122-1024','122-526','122-1064',
            '122-535','122-1022','122-1059','122-534','122-1021','122-532','122-1058','122-1057','122-533',
            '122-574','122-531','122-530','122-528','122-529','122-1020','122-1056','122-1019','122-1055','122-1054',
            '122-1102','122-1103','122-1101','122-1099','122-1100','122-1104',
            '122-1094','122-1093','122-1091','122-1092',
            '122-520','122-576','122-1023','122-1062','122-518','122-1060','122-1061','122-519',
            '122-1137','122-1098','122-1097','122-1095','122-1096','122-1198','122-1197',
          ]

          def render(series, keys, comments):
            lines = [f"  '{series}': new Set(["]
            lines.extend(f'    // {comment}' for comment in comments)
            for start in range(0, len(keys), 7):
              lines.append('    ' + ','.join(repr(k) for k in keys[start:start + 7]) + ',')
            lines.append('  ]),')
            return '\n'.join(lines) + '\n'

          addition = render('hyundai:i20', i20, [
            'Existing mappings remain reviewed when source gating is enabled.',
            'Only plain i20 engine/trim rows are admitted; Active, N, Troy, 48V and accessory-heavy rows stay review-only.',
          ])
          addition += render('renault:fluence', fluence, [
            'Only reviewed petrol/dCi engine + trim rows are admitted; Z.E., Bold Edition and uncertain aliases stay review-only.',
          ])
          text = text.replace(marker, marker + addition, 1)
          scope.write_text(text)
          PY
      - name: Verify focused policy tests
        run: pnpm --filter @bizzat/api exec vitest run test/vehicle-curation-i20-fluence-policy.test.ts
      - name: Commit implementation
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/reference/vehicle/curation/model-label.ts apps/api/src/reference/vehicle/curation/reviewed-source-scope.ts
          git diff --cached --stat
          git commit -m 'feat: add reviewed i20 and Fluence curation policies'
          git push origin HEAD:feat/vehicle-curation-policy-batch-4
