name: Foundation verify

on:
  push:
    branches: [feat/foundation]

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - run: pnpm install
      - run: pnpm contracts:build
      - run: pnpm --filter @bizzat/api test
      - run: pnpm --filter @bizzat/api typecheck
      - run: pnpm --filter @bizzat/api lint
      - run: pnpm --filter @bizzat/api build
      - name: Persist lockfile if dependency graph changed
        run: |
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore: update pnpm lockfile"
            git push
          fi
