name: Foundation verify

on:
  push:
    branches: [feat/foundation]

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - run: pnpm install --no-frozen-lockfile
      - run: cp .env.example .env
      - run: pnpm db:up
      - name: Wait for local PostgreSQL
        run: |
          until docker compose -f compose.dev.yml exec -T postgres pg_isready -U bizzat -d bizzat; do sleep 1; done
      - run: pnpm db:migrate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: test -f apps/web/.next/standalone/apps/web/server.js
      - name: Verify one-command dev and same-origin API proxy
        run: |
          pnpm dev > /tmp/bizzat-dev.log 2>&1 &
          DEV_PID=$!
          cleanup() {
            kill "$DEV_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/v1/health | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/bizzat-dev.log
          exit 1
      - name: Persist lockfile if dependency graph changed
        run: |
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore: update pnpm lockfile"
            git push
          fi
      - if: always()
        run: pnpm db:down || true
